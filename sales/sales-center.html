<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售分析中心 - 宝得经营平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/alfa.css">
    <style>
        .kpi-row-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }
        @media (max-width: 1200px) {
            .kpi-row-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .kpi-row-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(26,35,50,0.08);
            color: #6B7A94;
        }
        .rank-1 { background: rgba(0,87,184,0.15); color: #0057B8; }
        .rank-2 { background: rgba(0,178,227,0.18); color: #008AA8; }
        .rank-3 { background: rgba(141,198,63,0.20); color: #528419; }

        /* 新下单客户表格鼠标滚轮区域纤细滚动条 */
        .table-scroll-container::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-track {
            background: rgba(26, 35, 50, 0.04);
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(0, 87, 184, 0.35);
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 87, 184, 0.65);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex min-h-screen">

        <!-- ============== 左侧导航栏 (静态预渲染，杜绝切换闪烁) ============== -->
        <aside id="sidebar" class="sidebar w-56 flex-shrink-0 relative flex flex-col min-h-screen"></aside>

        <!-- ============== 主内容区 ============== -->
        <main class="flex-1 overflow-auto">
            <!-- 顶部导航条 (与企业经营驾驶舱 100% 相同，已取消导出数据按钮) -->
            <header id="page-header" class="top-bar sticky top-0 z-40 px-6 py-2.5">
                <div class="flex items-center justify-between">
                    <!-- 左侧：页面标题 -->
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-sm text-[#1A2332]">销售分析中心</span>
                    </div>

                    <!-- 右侧：年月选择胶囊 (与驾驶舱 100% 保持一致：动态近三年与未来月份拦截) -->
                    <div class="flex items-center">
                        <div class="relative inline-flex">
                            <div class="time-pill-group flex items-center px-3 py-1 select-none">
                                <!-- 年份选择触发器 -->
                                <div class="relative">
                                    <button id="yearDropdownBtn" onclick="toggleDropdown('yearDropdownMenu', event)" class="flex items-center gap-1 px-1.5 hover:text-[#0057B8] transition-colors cursor-pointer text-xs font-bold text-[#1A2332] mono-num">
                                        <span id="currentYearText">2026</span>
                                        <svg class="w-3 h-3 text-[#0057B8] transition-transform duration-200" id="yearChevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"/>
                                        </svg>
                                    </button>

                                    <!-- 年份下拉菜单 (动态渲染近三年) -->
                                    <div id="yearDropdownMenu" class="hidden dropdown-menu-floating left-0 top-full mt-2 w-32 py-1.5">
                                        <div id="yearDropdownOptions"></div>
                                    </div>
                                </div>

                                <span class="text-[#0057B8] text-xs px-1 font-light opacity-60">|</span>

                                <!-- 月份选择触发器 -->
                                <div class="relative">
                                    <button id="monthDropdownBtn" onclick="toggleDropdown('monthDropdownMenu', event)" class="flex items-center gap-1 px-1.5 hover:text-[#0057B8] transition-colors cursor-pointer text-xs font-bold text-[#1A2332]">
                                        <span id="currentMonthText">9月</span>
                                        <svg class="w-3 h-3 text-[#0057B8] transition-transform duration-200" id="monthChevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"/>
                                        </svg>
                                    </button>

                                    <!-- 月份下拉菜单 (动态禁用未来月份) -->
                                    <div id="monthDropdownMenu" class="hidden dropdown-menu-floating right-0 top-full mt-2 w-48 p-2.5">
                                        <div class="text-[10px] text-[#8A99B5] px-1 pb-1.5 font-semibold uppercase tracking-wider flex items-center justify-between">
                                            <span>选择月份</span>
                                            <span class="text-[9px] text-[#6B7A94]" id="monthLimitTip">当期最多至9月</span>
                                        </div>
                                        <div class="grid grid-cols-3 gap-1.5" id="monthOptionsGrid"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="p-3.5 space-y-3">

                <!-- 模块 1：销售总览与走势（企业经营驾驶舱同款卡片级封装） -->
                <div class="card">
                    <div class="card-inner">
                        <div class="flex items-center justify-between mb-2.5">
                            <div class="flex items-center gap-2">
                                <h3 class="section-title">销售分析总览</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <a href="sales-drilldown.html" class="px-2.5 py-1 rounded bg-[#0057B8]/10 text-[#0057B8] hover:bg-[#0057B8]/20 text-xs font-semibold transition-all">
                                    🔍 接单深度穿透 &rarr;
                                </a>
                                <a href="sales-industry.html" class="px-2.5 py-1 rounded bg-[#0057B8]/10 text-[#0057B8] hover:bg-[#0057B8]/20 text-xs font-semibold transition-all">
                                    📊 行业经营分析表 &rarr;
                                </a>
                                <a href="sales-rep.html" class="px-2.5 py-1 rounded bg-[#5F8E68]/10 text-[#5F8E68] hover:bg-[#5F8E68]/20 text-xs font-semibold transition-all">
                                    👤 业务员目标管理表 &rarr;
                                </a>
                            </div>
                        </div>

                        <!-- 6大核心KPI（嵌入在大卡片内部！） -->
                        <div id="kpi-cards" class="sales-overview-grid mb-3"></div>

                        <!-- 接单 · 出库 · 回款 周次递增走势（独占一行，全宽展示，与月份周次深度联动） -->
                        <div class="chart-card">
                            <div class="chart-card-title">
                                <span class="chart-card-title-text" id="trend-chart-title">接单 · 出库 · 回款 逐周累计走势</span>
                            </div>
                            <div id="trend-chart" class="chart-box" style="height: 260px; min-height: 260px;"></div>
                        </div>
                    </div>
                </div>

                <!-- 模块 2：出货销售额与毛利分析（独占一行，宽度拉长，按客户/产品/行业多维透视） -->
                <div class="card">
                    <div class="card-inner">
                        <div class="flex items-center justify-between mb-2.5">
                            <h3 class="section-title">出货销售额与毛利分析</h3>
                        </div>

                        <div class="chart-card">
                            <div class="flex items-center justify-between mb-1.5">
                                <div class="chart-card-title !mb-0">
                                    <span class="chart-card-title-text" id="margin-chart-title">重点客户 出货销售额与毛利表现</span>
                                </div>
                                <div class="tab-bar">
                                    <button type="button" class="tab-btn active" data-dim="customer" onclick="switchDim(this)">按客户</button>
                                    <button type="button" class="tab-btn" data-dim="product" onclick="switchDim(this)">按产品</button>
                                    <button type="button" class="tab-btn" data-dim="industry" onclick="switchDim(this)">按行业</button>
                                </div>
                            </div>
                            <div id="margin-chart" class="chart-box" style="height: 280px; min-height: 280px;"></div>
                        </div>
                    </div>
                </div>

                <!-- 模块 3：应收账龄结构 与 新下单客户明细（两者合并形成一行） -->
                <div class="card">
                    <div class="card-inner">
                        <div class="flex items-center justify-between mb-2.5">
                            <h3 class="section-title">应收账龄与新客户监控</h3>
                        </div>

                        <div class="multi-chart-row two">
                            <!-- 左侧：应收账龄结构 -->
                            <div class="chart-card flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-1.5">
                                        <div class="chart-card-title !mb-0">
                                            <span class="chart-card-title-text">应收账龄结构</span>
                                        </div>
                                        <span class="text-[11px] text-[#6B7A94] font-normal">当月全量应收</span>
                                    </div>
                                    <div id="aging-chart" class="chart-box" style="height: 210px; min-height: 210px;"></div>
                                </div>
                                <div class="grid grid-cols-3 gap-2 mt-2 pt-2 border-t border-[rgba(26,35,50,0.06)]" id="aging-kpis"></div>
                            </div>

                            <!-- 右侧：新下单客户明细 -->
                            <div class="chart-card flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-1.5">
                                        <div class="chart-card-title !mb-0">
                                            <span class="chart-card-title-text">新下单客户明细</span>
                                        </div>
                                        <span class="text-[11px] text-[#5F8E68] font-bold">本期新拓</span>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2 mb-2" id="newcust-kpis"></div>
                                    <div class="overflow-y-auto overflow-x-auto table-scroll-container rounded border border-[rgba(26,35,50,0.06)] bg-white/40" style="height: 185px; max-height: 185px;">
                                        <table class="w-full text-xs">
                                            <thead class="sticky top-0 z-10 bg-[#EEF3F8] shadow-sm">
                                                <tr class="bg-[rgba(0,87,184,0.08)] text-[#4A5870] text-[11px] font-bold border-b border-[rgba(26,35,50,0.1)]" style="height: 28px;">
                                                    <th class="text-left px-2.5 py-1">客户名称</th>
                                                    <th class="text-right px-2.5 py-1">首单出库额</th>
                                                    <th class="text-right px-2.5 py-1">下单日期</th>
                                                </tr>
                                            </thead>
                                            <tbody id="newcust-tbody" class="divide-y divide-[rgba(26,35,50,0.06)] text-[11.5px]"></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 模块 4：逾期应收分析与客户排名 -->
                <div class="card">
                    <div class="card-inner">
                        <div class="flex items-center justify-between mb-2.5">
                            <h3 class="section-title">逾期应收分析</h3>
                            <span class="text-xs text-[#D0021B] font-semibold">重点预警</span>
                        </div>

                        <div class="grid grid-cols-12 gap-3.5">
                            <!-- 左侧：逾期业务类别分布诊断大盘 -->
                            <div class="col-span-12 lg:col-span-5 chart-card flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-1.5">
                                        <div class="chart-card-title !mb-0">
                                            <span class="chart-card-title-text">逾期类别分布</span>
                                        </div>
                                        <span class="text-[11px] text-[#6B7A94]">普通 · 外贸 · 机组</span>
                                    </div>

                                    <!-- 3大核心逾期风控指标卡 -->
                                    <div class="grid grid-cols-3 gap-2 mb-2" id="overdue-kpis"></div>

                                    <!-- 逾期类别分布分析：环形图 + 明细列表 -->
                                    <div class="pt-2.5 border-t border-[rgba(26,35,50,0.06)]">
                                        <div class="grid grid-cols-12 gap-2.5 items-center">
                                            <!-- 环形图容器 -->
                                            <div class="col-span-5">
                                                <div id="overdue-reason-chart" style="height: 180px; width: 100%;"></div>
                                            </div>
                                            <!-- 类别明细进度条与金额 -->
                                            <div class="col-span-7 space-y-2.5" id="overdue-reason-list"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 右侧：客户逾期排名 TOP10 -->
                            <div class="col-span-12 lg:col-span-7 chart-card flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-1.5">
                                        <div class="chart-card-title !mb-0">
                                            <span class="chart-card-title-text">客户逾期排名 TOP10</span>
                                        </div>
                                        <span class="text-xs text-[#0057B8] cursor-pointer hover:underline select-none" onclick="toggleSort()">点击金额列排序 ⇅</span>
                                    </div>
                                    <div class="overflow-y-auto overflow-x-auto table-scroll-container rounded border border-[rgba(26,35,50,0.06)] bg-white/40" style="height: 245px; max-height: 245px;">
                                        <table class="w-full text-xs">
                                            <thead class="sticky top-0 z-10 bg-[#EEF3F8] shadow-sm">
                                                <tr class="bg-[rgba(0,87,184,0.08)] text-[#4A5870] text-[11px] font-bold border-b border-[rgba(26,35,50,0.1)]" style="height: 28px;">
                                                    <th class="w-12 text-center px-1 py-1">排名</th>
                                                    <th class="text-left px-2.5 py-1">客户名称</th>
                                                    <th class="text-right px-2.5 py-1 cursor-pointer select-none" onclick="toggleSort()">逾期金额 (万) ⇅</th>
                                                    <th class="text-right px-2.5 py-1">占逾期总额</th>
                                                    <th class="text-right px-2.5 py-1">最长账龄</th>
                                                    <th class="text-center px-2.5 py-1 w-20">风险等级</th>
                                                </tr>
                                            </thead>
                                            <tbody id="rank-tbody" class="divide-y divide-[rgba(26,35,50,0.06)] text-[11.5px]"></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../assets/js/layout.js"></script>
    <script>

    var DATA = buildMock();
    var sortDesc = true;
    var charts = {};

    function fmt(n) { return (n || 0).toLocaleString('zh-CN'); }

    /* ---------- 1. 渲染 6 大核心 KPI (驾驶舱统一 sales-overview-cell 样式) ---------- */
    function renderKPIs() {
        var k = DATA.kpi;
        var cards = [
            { label: '接单销售额', value: fmt(k.orderAmt), unit: '万', color: '#0057B8' },
            { label: '出货销售额', value: fmt(k.shipAmt), unit: '万', color: '#1A2332' },

            { label: '月度计划达成率', value: k.monthRate.toFixed(1), unit: '%', color: '#0057B8' },
            { label: '年度累计达成率', value: k.yearRate.toFixed(1), unit: '%', color: '#5F8E68' },
            { label: '综合毛利率', value: k.marginRate.toFixed(1), unit: '%', color: '#5F8E68' }
        ];

                    (isOrderAmt ? 'onclick="location.href=\'sales-drilldown.html\'" title="💡 点击穿透：查看接单销售额多维深度分析看板"' : '') + '>' +
                    '<div class="kpi-label">' + c.label + '</div>' +
                    '<div class="kpi-value sales-overview-value ' + (isOrderAmt ? 'group-hover:text-[#0057B8] transition-colors' : '') + '" style="color:' + c.color + '">' + c.value + '<span class="unit text-xs">' + c.unit + '</span></div>' +
                    '</div>';
            }).join('');
        }
    }

    /* ---------- 2. 渲染 接单 · 出库 · 回款 周次递增趋势 (与选择月份深度联动) ---------- */
    function getMonthWeeks(year, month) {
        var y = parseInt(year) || 2026;
        var m = parseInt(month) || 9;
        var daysInMonth = new Date(y, m, 0).getDate();
        // 经营习惯：28天的平年2月为4周，其余月份为5周滚动闭环
        var numWeeks = daysInMonth <= 28 ? 4 : 5;
        var weeks = [];
        for (var i = 1; i <= numWeeks; i++) {
            if (i === numWeeks) {
                weeks.push('W' + i + ' (月累计)');
            } else {
                weeks.push('W' + i);
            }
        }
        return { numWeeks: numWeeks, weeks: weeks, year: y, month: m, monthName: m + '月' };
    }

    function getWeeklyCumulative(total, numWeeks, ratios) {
        var defaultRatios = numWeeks === 4
            ? [0.28, 0.54, 0.80, 1.00]
            : [0.22, 0.46, 0.70, 0.88, 1.00];
        var r = ratios || defaultRatios;
        return r.map(function(val, idx) {
            if (idx === numWeeks - 1) return total;
            return Math.round(total * val);
        });
    }

    function renderTrend() {
        var el = document.getElementById('trend-chart');
        if (!el) return;
        charts.trend = charts.trend || echarts.init(el);

        var p = (typeof BDLayout !== 'undefined' && BDLayout.getPeriod) ? BDLayout.getPeriod() : { year: 2026, month: 9 };
        var wInfo = getMonthWeeks(p.year, p.month);

        var titleEl = document.getElementById('trend-chart-title');
        if (titleEl) {
            titleEl.textContent = '接单 · 出库 · 回款 逐周累计走势';
        }

        var orderWeekly = getWeeklyCumulative(DATA.kpi.orderAmt, wInfo.numWeeks, wInfo.numWeeks === 4 ? [0.28, 0.55, 0.82, 1.00] : [0.23, 0.48, 0.72, 0.89, 1.00]);
        var shipWeekly = getWeeklyCumulative(DATA.kpi.shipAmt, wInfo.numWeeks, wInfo.numWeeks === 4 ? [0.25, 0.52, 0.78, 1.00] : [0.21, 0.45, 0.69, 0.87, 1.00]);
        var recWeekly = getWeeklyCumulative(DATA.kpi.receivedAmt, wInfo.numWeeks, wInfo.numWeeks === 4 ? [0.22, 0.49, 0.75, 1.00] : [0.19, 0.42, 0.66, 0.85, 1.00]);

        // 上月全月累计基准数据（放置在最左侧“上月累计”列，本月折线直接连贯至W1~W5）
        var lastMonthOrder = 18500; // 上月接单全月累计（万元）
        var lastMonthShip = 16840;  // 上月出库全月累计（万元）
        var lastMonthRec = 15900;   // 上月回款全月累计（万元）

        var xAxisCategories = ['上月累计'].concat(wInfo.weeks);
        var orderData = [lastMonthOrder].concat(orderWeekly);
        var shipData = [lastMonthShip].concat(shipWeekly);
        var recData = [lastMonthRec].concat(recWeekly);

        charts.trend.setOption({
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(26, 35, 50, 0.92)',
                borderColor: 'rgba(255,255,255,0.2)',
                textStyle: { color: '#FFFFFF', fontSize: 12 },
                axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(46,110,181,0.06)' } },
                formatter: function (params) {
                    var axisName = params[0].axisValue;
                    var isLastMonth = axisName === '上月累计';
                    var html = '<div class="font-bold mb-1.5 text-xs text-white/90 border-b border-white/20 pb-1">' +
                        (isLastMonth ? '上月全月累计完成基准' : (wInfo.monthName + ' ' + axisName + ' 逐周累计走势')) +
                        '</div>';
                    var shipVal = 0;
                    params.forEach(function (param) {
                        if (param.seriesName === '出库销售额') shipVal = Number(param.value);
                        var colorHex = param.color && param.color.colorStops ? param.color.colorStops[0].color : (typeof param.color === 'string' ? param.color : '#2E6EB5');
                        html += '<div class="flex items-center justify-between gap-5 text-xs py-0.5">' +
                            '<span><span style="color:' + colorHex + '">● </span>' + param.seriesName + '</span>' +
                            '<span class="font-mono font-bold text-white">' + fmt(param.value) + ' 万元</span>' +
                            '</div>';
                    });
                    if (!isLastMonth && shipVal > 0) {
                        var diff = shipVal - lastMonthShip;
                        var pct = ((shipVal / lastMonthShip) * 100).toFixed(1);
                        if (diff >= 0) {
                            html += '<div class="mt-1.5 pt-1.5 border-t border-white/15 flex items-center justify-between text-[11px]">' +
                                '<span class="text-white/80">🚀 较上月出库全额：</span>' +
                                '<span class="font-mono font-bold text-[#8DC63F]">已超赶 +' + fmt(diff) + ' 万元 (' + pct + '%)</span>' +
                                '</div>';
                        } else {
                            html += '<div class="mt-1.5 pt-1.5 border-t border-white/15 flex items-center justify-between text-[11px]">' +
                                '<span class="text-white/80">🎯 距离超赶上月出库：</span>' +
                                '<span class="font-mono font-bold text-[#E87722]">还差 ' + fmt(Math.abs(diff)) + ' 万元 (已达' + pct + '%)</span>' +
                                '</div>';
                        }
                    }
                    return html;
                }
            },
            legend: {
                data: ['接单销售额', '出库销售额', '销售回款额'],
                top: 0,
                right: 0,
                itemWidth: 12,
                itemHeight: 10,
                textStyle: { fontSize: 12, color: '#4A5870', fontWeight: 500 }
            },
            grid: { left: 56, right: 24, top: 38, bottom: 28 },
            xAxis: {
                type: 'category',
                data: xAxisCategories,
                axisLine: { lineStyle: { color: 'rgba(26,35,50,0.12)' } },
                axisTick: { show: false },
                axisLabel: {
                    fontSize: 11.5,
                    color: function(val) {
                        if (val === '上月累计') return '#4A5870';
                        return val.indexOf('月累计') !== -1 ? '#0057B8' : '#6B7A94';
                    },
                    fontWeight: function(val) {
                        return (val === '上月累计' || val.indexOf('月累计') !== -1) ? '700' : '500';
                    }
                }
            },
            yAxis: {
                type: 'value',
                splitLine: { lineStyle: { color: 'rgba(26,35,50,0.06)', type: 'dashed' } },
                axisLabel: { color: '#6B7A94', fontSize: 11 }
            },
            series: [
                {
                    name: '接单销售额',
                    type: 'bar',
                    barWidth: 15,
                    barGap: '20%',
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#1D63B8' },
                            { offset: 1, color: '#0E4894' }
                        ]),
                        borderRadius: [3, 3, 0, 0]
                    },
                    data: orderData
                },
                {
                    name: '出库销售额',
                    type: 'bar',
                    barWidth: 15,
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#5B97D5' },
                            { offset: 1, color: '#82B0E0' }
                        ]),
                        borderRadius: [3, 3, 0, 0]
                    },
                    data: shipData
                },
                {
                    name: '销售回款额',
                    type: 'line',
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 7,
                    lineStyle: { color: '#5F8E68', width: 2.5 },
                    itemStyle: { color: '#5F8E68', borderColor: '#FFFFFF', borderWidth: 2 },
                    data: recData
                }
            ]
        }, true);
    }

    /* ---------- 3. 渲染 出货销售额与毛利分析（按客户 / 按产品 / 按行业，全宽拉长） ---------- */

    /* ---------- 6. 渲染 TOP10 客户逾期排名 ---------- */
    function renderRanks() {
        var rows = DATA.ranks.slice().sort(function (a, b) { return sortDesc ? b.amt - a.amt : a.amt - b.amt; });
        var total = DATA.ranks.reduce(function (s, r) { return s + r.amt; }, 0);
        var rankDom = document.getElementById('rank-tbody');
        if (rankDom) {
            rankDom.innerHTML = rows.map(function (r, i) {
                var risk = r.amt > 150 ? ['status-danger', '高风险'] : r.amt > 80 ? ['status-warning', '中风险'] : ['status-info', '低风险'];
                return '<tr class="hover:bg-[#0057B8]/5 transition-colors">' +
                    '<td class="text-center py-2.5 px-2"><span class="rank-badge ' + (i < 3 ? 'rank-' + (i + 1) : '') + '">' + (i + 1) + '</span></td>' +
                    '<td class="py-2.5 px-3 text-[#1A2332] font-semibold text-xs">' + r.name + '</td>' +
                    '<td class="py-2.5 px-3 text-right font-bold text-[#E87722] mono-num text-xs">' + fmt(r.amt) + '</td>' +
                    '<td class="py-2.5 px-3 text-right text-[#6B7A94] mono-num text-xs">' + (r.amt / total * 100).toFixed(1) + '%</td>' +

                    '<td class="py-2.5 px-3 text-center"><span class="status-tag ' + risk[0] + '">' + risk[1] + '</span></td>' +
                    '</tr>';
            }).join('');
        }
    }

                '<div class="kpi-box text-center p-3 rounded-lg bg-[rgba(26,35,50,0.03)] border border-[rgba(26,35,50,0.06)]">' +
                '<div class="text-xs text-[#6B7A94] mb-0.5">本期新拓客户数</div>' +
                '<div class="text-xl font-bold text-[#2E6EB5] mono-num">' + nc.count + '<span class="text-xs ml-1 font-semibold text-[#6B7A94]">家</span></div>' +
                '</div>' +
                '<div class="kpi-box text-center p-3 rounded-lg bg-[rgba(26,35,50,0.03)] border border-[rgba(26,35,50,0.06)]">' +
                '<div class="text-xs text-[#6B7A94] mb-0.5">首单出库合计</div>' +
                '<div class="text-xl font-bold text-[#5F8E68] mono-num">' + fmt(nc.totalAmt) + '<span class="text-xs ml-1 font-semibold text-[#6B7A94]">元</span></div>' +
                '</div>';
        }

        var newTbody = document.getElementById('newcust-tbody');
        if (newTbody) {
            newTbody.innerHTML = nc.list.map(function (c) {
                return '<tr class="hover:bg-[#0057B8]/5 transition-colors">' +
                    '<td class="py-2.5 px-3 text-[#1A2332] font-semibold text-xs">' + c.name + '</td>' +
                    '<td class="py-2.5 px-3 text-right font-bold text-[#5F8E68] mono-num text-xs">' + fmt(c.amt) + ' 元</td>' +
                    '<td class="py-2.5 px-3 text-right text-[#6B7A94] mono-num text-xs">' + c.date + '</td>' +
                    '</tr>';
            }).join('');
        }
    }

    /* ---------- 8. 年月联动事件处理 ---------- */
    function onPeriodChange() {
        var p = BDLayout.getPeriod();
        var mIdx = parseInt(p.month) || 9;
        var factor = 0.9 + (mIdx % 5) * 0.04;
        DATA.kpi.orderAmt = Math.round(19359 * factor);
        DATA.kpi.shipAmt = Math.round(17910 * factor);
        DATA.kpi.receivedAmt = Math.round(16840 * factor);
        DATA.kpi.monthRate = +(95.8 * factor).toFixed(1);
        DATA.overdue.total = Math.round(1030 * (1.15 - (mIdx % 4) * 0.05));
        renderKPIs();
        renderTrend();
        renderMargin();
        renderAging();
        renderOverdue();
        renderRanks();
    }
    window.onPeriodChange = onPeriodChange;
    window.switchDim = switchDim;
    window.toggleSort = toggleSort;

    // 页面初始化
    function initSalesCenter() {
        BDLayout.render({ active: "sales-overview" });
        renderKPIs();
        renderTrend();
        renderAging();
        renderOverdue();
        renderRanks();
        renderMargin();
        renderNewCustomers();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSalesCenter);
    } else {
        initSalesCenter();
    }

    window.addEventListener('resize', function () {
        Object.keys(charts).forEach(function (k) {
            try { charts[k] && charts[k].resize && charts[k].resize(); } catch (e) {}
        });
    });
    </script>
</body>
</html>
