<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>质量管控分析 - 宝得经营平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/alfa.css">
    <style>
        /* 台账表格鼠标滚轮滚动区域纤细滚动条 */
        .table-scroll-container::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-track {
            background: rgba(26, 35, 50, 0.04);
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(0, 87, 184, 0.35);
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 87, 184, 0.6);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex min-h-screen">
        <aside id="sidebar" class="sidebar w-56 flex-shrink-0 relative flex flex-col min-h-screen"></aside>

        <main class="flex-1 overflow-auto">
            <!-- 顶部导航条 (与企业经营驾驶舱 100% 相同) -->
            <header id="page-header" class="top-bar sticky top-0 z-40 px-6 py-2.5">
                <div class="flex items-center justify-between">
                    <!-- 左侧：页面标题 -->
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-sm text-[#1A2332]">生产分析中心 · 质量管控</span>
                    </div>

                    <!-- 右侧：年月选择胶囊 (与驾驶舱 100% 保持一致：动态近三年与未来月份拦截) -->
                    <div class="flex items-center">
                        <div class="relative inline-flex">
                            <div class="time-pill-group flex items-center px-3 py-1 select-none">
                                <!-- 年份选择触发器 -->
                                <div class="relative">
                                    <button id="yearDropdownBtn" onclick="toggleDropdown('yearDropdownMenu', event)" class="flex items-center gap-1 px-1.5 hover:text-[#0057B8] transition-colors cursor-pointer text-xs font-bold text-[#1A2332] mono-num">
                                        <span id="currentYearText">2026</span>
                                        <svg class="w-3 h-3 text-[#0057B8] transition-transform duration-200" id="yearChevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"/>
                                        </svg>
                                    </button>

                                    <!-- 年份下拉菜单 (动态渲染近三年) -->
                                    <div id="yearDropdownMenu" class="hidden dropdown-menu-floating left-0 top-full mt-2 w-32 py-1.5">
                                        <div id="yearDropdownOptions"></div>
                                    </div>
                                </div>

                                <span class="text-[#0057B8] text-xs px-1 font-light opacity-60">|</span>

                                <!-- 月份选择触发器 -->
                                <div class="relative">
                                    <button id="monthDropdownBtn" onclick="toggleDropdown('monthDropdownMenu', event)" class="flex items-center gap-1 px-1.5 hover:text-[#0057B8] transition-colors cursor-pointer text-xs font-bold text-[#1A2332]">
                                        <span id="currentMonthText">9月</span>
                                        <svg class="w-3 h-3 text-[#0057B8] transition-transform duration-200" id="monthChevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"/>
                                        </svg>
                                    </button>

                                    <!-- 月份下拉菜单 (动态禁用未来月份) -->
                                    <div id="monthDropdownMenu" class="hidden dropdown-menu-floating right-0 top-full mt-2 w-48 p-2.5">
                                        <div class="text-[10px] text-[#8A99B5] px-1 pb-1.5 font-semibold uppercase tracking-wider flex items-center justify-between">
                                            <span>选择月份</span>
                                            <span class="text-[9px] text-[#6B7A94]" id="monthLimitTip">当期最多至9月</span>
                                        </div>
                                        <div class="grid grid-cols-3 gap-1.5" id="monthOptionsGrid"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="p-3.5 space-y-3">
                <!-- 模块 1：质量管控核心运营总览（与企业经营驾驶舱 100% 对齐） -->
                <div class="card">
                    <div class="card-inner">
                        <div class="flex items-center justify-between mb-2.5">
                            <h3 class="section-title">质量管控分析总览</h3>
                        </div>
                        <div id="kpi-cards" class="sales-overview-grid mb-1"></div>
                    </div>
                </div>

                <!-- 车间质量对比区：钎焊 / 板片 / 可拆 三车间 tab 切换 -->
                <div class="card p-7 mb-6">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h3 class="section-title font-semibold text-[#0B1128]">车间质量对比分析</h3>
                        </div>
                        <div class="tab-bar" id="ws-tabs">
                            <button class="tab-btn active" data-ws="brazing" onclick="switchWs(this)">钎焊车间</button>
                            <button class="tab-btn" data-ws="plate" onclick="switchWs(this)">板片车间</button>
                            <button class="tab-btn" data-ws="detachable" onclick="switchWs(this)">可拆车间</button>
                        </div>
                    </div>
                    <!-- 钎焊车间面板 -->
                    <div id="ws-brazing">
                        <div class="flex items-center justify-between mb-4">
                            <div class="text-sm font-medium text-[#0B1128]">钎焊车间 · 核心指标</div>
                            <div class="tab-bar">
                                <button class="tab-btn dim-btn active" data-dim="wt" onclick="switchDim(this)">重量维度</button>
                                <button class="tab-btn dim-btn" data-dim="qty" onclick="switchDim(this)">数量维度 ★</button>
                            </div>
                        </div>
                        <div id="brazing-kpis" class="sales-overview-grid mb-5"></div>
                        <div id="brazing-chart" class="chart-container"></div>
                    </div>

                    <!-- 板片车间面板 -->
                    <div id="ws-plate" style="display:none">
                        <div class="flex items-center justify-between mb-4">
                            <div class="text-sm font-medium text-[#0B1128]">板片车间 · 报废分析</div>
                            <div class="tab-bar">
                                <button class="tab-btn dim-btn active" data-dim="wt" onclick="switchDim(this)">重量维度</button>
                                <button class="tab-btn dim-btn" data-dim="qty" onclick="switchDim(this)">数量维度 ★</button>
                            </div>
                        </div>
                        <div id="plate-kpis" class="sales-overview-grid mb-5"></div>
                        <div id="plate-chart" class="chart-container"></div>
                    </div>

                    <!-- 可拆车间面板 -->
                    <div id="ws-detachable" style="display:none">
                        <div class="flex items-center justify-between mb-4">
                            <div class="text-sm font-medium text-[#0B1128]">可拆车间 · 一次合格率分析</div>
                        </div>
                        <div id="detachable-kpis" class="sales-overview-grid mb-5"></div>
                        <div id="detachable-chart" class="chart-container"></div>
                    </div>
                </div>

                <!-- 来料质量分析 IQC：左侧周累计堆积柱状图+折线图 + 右侧供应商来料合格明细 -->
                <div class="grid grid-cols-12 gap-6 mb-6">
                    <div class="col-span-12 lg:col-span-6 card p-6">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <h3 class="section-title font-semibold text-[#0B1128]">来料质量分析 IQC</h3>
                            </div>
                        </div>
                        <!-- 4个汇总指标卡片（保持与总览及客诉指标一致风格） -->
                        <div id="iqc-kpis" class="sales-overview-grid mb-3"></div>
                        <!-- 周累计趋势图：合格批次与不合格批次堆积柱状图 + 来料合格率折线图 -->
                        <div id="iqcTrendChart" class="chart-box" style="height: 250px; min-height: 250px;"></div>
                    </div>
                    <!-- 右侧：供应商来料不合格 Top 10（设计样式与超期库存客户排名 Top 10 一致，首屏5行滑轮滚动） -->
                    <div class="col-span-12 lg:col-span-6 card p-6">
                        <div class="flex items-center justify-between mb-1.5">
                            <h3 class="section-title font-semibold text-[#0B1128]">供应商来料不合格 Top 10</h3>
                            <span class="text-xs text-[#E87722] font-semibold" id="iqcNgTotalText">不合格总批次 14 批</span>
                        </div>
                        <div id="iqcSupplierRankChart" class="chart-box" style="height: 270px; min-height: 270px;"></div>
                    </div>
                </div>
                <!-- 客诉分析：钎焊 / 可拆 Tab 切换 + 统一指标 + 周累计趋势 + 责任分布 + 截至当前月走势 -->
                <div class="card mb-6">
                    <div class="card-inner">
                        <!-- 标题栏 + 右侧 Tab 页签 -->
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-[rgba(26,35,50,0.06)]">
                            <div>
                                <h3 class="section-title">客诉分析</h3>
                            </div>
                            <!-- 右侧 Tab 页签 -->
                            <div class="inline-flex p-1 bg-slate-100 rounded-lg border border-slate-200/80">
                                <button id="complaintTabBrazing" onclick="switchComplaintTab('brazing')" class="px-3.5 py-1 text-xs font-bold rounded-md transition-all cursor-pointer bg-white text-[#0057B8] shadow-xs">
                                    钎焊换热器
                                </button>
                                <button id="complaintTabDetachable" onclick="switchComplaintTab('detachable')" class="px-3.5 py-1 text-xs font-semibold rounded-md transition-all cursor-pointer text-[#6B7A94] hover:text-[#1A2332]">
                                    可拆换热器
                                </button>
                            </div>
                        </div>

                        <!-- 统一指标卡片栏（6个指标月度汇总值，风格与质量管控分析总览保持100%一致） -->
                        <div id="complaintsKpiRow" class="sales-overview-grid" style="margin-bottom: 18px !important;">
                            <!-- 动态渲染：客诉数量、已关闭客诉、未关闭客诉、客诉率、客诉PPM、客诉关闭率 -->
                        </div>

                        <!-- 中间图表区域：周累计趋势 (7列) + 客诉责任分布 (5列) -->
                        <div class="grid grid-cols-12 gap-5 mb-5">
                            <div class="col-span-12 lg:col-span-7 bg-white/50 p-3.5 rounded-lg border border-slate-100">
                                <div class="flex items-center justify-between mb-2">
                                    <div class="text-xs font-bold text-[#1A2332] flex items-center gap-1.5">
                                        <span class="w-1.5 h-3 bg-[#0057B8] rounded-full"></span>
                                        <span id="complaintWeekTitle">客诉率与客诉关闭率周累计趋势</span>
                                    </div>
                                </div>
                                <div id="complaintWeekChart" class="chart-box" style="height: 220px; min-height: 220px;"></div>
                            </div>
                            <div class="col-span-12 lg:col-span-5 bg-white/50 p-3.5 rounded-lg border border-slate-100">
                                <div class="flex items-center justify-between mb-2">
                                    <div class="text-xs font-bold text-[#1A2332] flex items-center gap-1.5">
                                        <span class="w-1.5 h-3 bg-[#5F8E68] rounded-full"></span>
                                        <span id="complaintDutyTitle">客诉原因分布</span>
                                    </div>
                                </div>
                                <div id="complaintDutyChart" class="chart-box" style="height: 220px; min-height: 220px;"></div>
                            </div>
                        </div>

                        <!-- 下方图表区域：截至当前月的每月客诉趋势 -->
                        <div class="bg-white/50 p-3.5 rounded-lg border border-slate-100">
                            <div class="flex items-center justify-between mb-2">
                                <div class="text-xs font-bold text-[#1A2332] flex items-center gap-1.5">
                                    <span class="w-1.5 h-3 bg-[#E87722] rounded-full"></span>
                                    <span id="complaintMonthlyTitle">截至当前月的每月客诉趋势</span>
                                </div>
                            </div>
                            <div id="complaintMonthlyTrendChart" class="chart-box" style="height: 200px; min-height: 200px;"></div>
                        </div>
                    </div>
                </div>

                <!-- 未关闭客诉跟踪台账 (与高库龄与呆滞物料风险预警台账统一风格) -->
                <div class="card">
                    <div class="card-inner">
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <h3 class="section-title">未关闭客诉跟踪台账</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-500/10 text-rose-600 border border-rose-500/20">
                                    严重超期 (>7天) 2起
                                </span>
                                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/10 text-amber-600 border border-amber-500/20">
                                    一般超期 (1~7天) 3起
                                </span>
                                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-500/10 text-blue-600 border border-blue-500/20">
                                    正常推进中 5起
                                </span>
                                <button onclick="exportComplaintsExcel()" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg border border-[rgba(0,87,184,0.3)] bg-[#0057B8]/10 hover:bg-[#0057B8]/20 text-xs font-semibold text-[#0057B8] transition-all cursor-pointer shadow-xs active:scale-95" title="导出客诉台账至标准 Excel (.xlsx)">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                    </svg>
                                    <span>导出 Excel</span>
                                </button>
                            </div>
                        </div>

                        <div class="overflow-y-auto overflow-x-auto table-scroll-container rounded border border-[rgba(26,35,50,0.06)] bg-white/40" style="height: 208px; max-height: 208px;">
                            <table class="w-full text-xs text-left">
                                <thead class="sticky top-0 z-10 bg-[#EEF3F8] shadow-sm">
                                    <tr class="bg-[rgba(0,87,184,0.06)] text-[#6B7A94] text-[11px] font-bold border-b border-[rgba(26,35,50,0.1)]" style="height: 32px;">
                                        <th class="py-2 px-3">客诉编号</th>
                                        <th class="py-2 px-3">客户名称</th>
                                        <th class="py-2 px-3">涉及产品</th>
                                        <th class="py-2 px-3">问题描述</th>
                                        <th class="py-2 px-3">责任人</th>
                                        <th class="py-2 px-3">当前状态</th>
                                        <th class="py-2 px-3">超期情况</th>
                                        <th class="py-2 px-3 text-right">金额影响 (万元)</th>
                                        <th class="py-2 px-3">拟处置方案 / 8D进展</th>
                                    </tr>
                                </thead>
                                <tbody id="open-complaints-tbody" class="divide-y divide-[rgba(26,35,50,0.05)]">
                                    <!-- 动态渲染 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/layout.js"></script>

    function exportComplaintsExcel() {
        if (!DATA.openComplaints || !DATA.openComplaints.length) {

            return;
        }

        var headers = ['客诉编号', '客户名称', '涉及产品', '问题描述', '责任人', '当前状态', '超期情况', '金额影响 (万元)', '拟处置方案 / 8D进展'];
        var aoa = [headers];

        DATA.openComplaints.forEach(function(c) {
            aoa.push([
                c.no,
                c.cust,
                c.prod,
                c.desc,
                c.owner,
                c.status,
                c.overdue > 0 ? ('超期 ' + c.overdue + ' 天') : '正常',
                Number(c.amt),
                c.plan || '-'
            ]);
        });

        var now = new Date();
        var y = now.getFullYear();
        var m = String(now.getMonth() + 1).padStart(2, '0');
        var d = String(now.getDate()).padStart(2, '0');
        var fileName = '未关闭客诉跟踪台账_' + y + m + d + '.xlsx';

        if (typeof XLSX !== 'undefined') {
            var ws = XLSX.utils.aoa_to_sheet(aoa);
            ws['!cols'] = [
                { wch: 15 }, // 客诉编号
                { wch: 22 }, // 客户名称
                { wch: 20 }, // 涉及产品
                { wch: 22 }, // 问题描述
                { wch: 10 }, // 责任人
                { wch: 12 }, // 当前状态
                { wch: 12 }, // 超期情况
                { wch: 14 }, // 金额影响
                { wch: 36 }  // 拟处置方案
            ];
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '未关闭客诉台账');
            XLSX.writeFile(wb, fileName);
            showToast('已成功导出标准 Excel (.xlsx) 客诉跟踪台账！');
        } else {
            alert('Excel 导出组件加载中，请稍后再试！');
        }
    }

    function onPeriodChange() {
        var p = BDLayout.getPeriod();
        var mIdx = parseInt(p.month) || 7;
        var f = 0.9 + (mIdx % 5) * 0.05;
        DATA.kpi.brazingPassQty = +(97.4 + (mIdx % 6) * 0.3).toFixed(1);
        DATA.kpi.brazingPassWt = +(DATA.kpi.brazingPassQty + 0.2).toFixed(1);
        DATA.kpi.reworkRate = +(2.6 - (mIdx % 6) * 0.28).toFixed(2);
        DATA.kpi.scrapRateWt = +(0.7 + (mIdx % 4) * 0.06).toFixed(2);
        DATA.kpi.scrapRateQty = +(DATA.kpi.scrapRateWt - 0.18).toFixed(2);
        DATA.kpi.scrapAmt = +(11.8 * f).toFixed(1);
        DATA.kpi.ppm = Math.round(118 * f);
        DATA.kpi.iqcRate = +(96.2 + (mIdx % 4) * 0.3).toFixed(1);
        var fIqc = 0.92 + (mIdx % 4) * 0.04;
        var newTotal = Math.round(486 * fIqc);
        var newRate = DATA.kpi.iqcRate;
        var newOk = Math.round(newTotal * (newRate / 100));
        var newNg = newTotal - newOk;
        DATA.iqc.total = newTotal;
        DATA.iqc.ok = newOk;
        DATA.iqc.ng = newNg;
        DATA.iqc.rate = newRate;
        DATA.iqc.weekOkCum = [
            Math.round(newOk * 0.20),
            Math.round(newOk * 0.40),
            Math.round(newOk * 0.60),
            Math.round(newOk * 0.81),
            newOk
        ];
        DATA.iqc.weekNgCum = [
            Math.max(1, Math.round(newNg * 0.15)),
            Math.max(2, Math.round(newNg * 0.35)),
            Math.max(3, Math.round(newNg * 0.65)),
            Math.max(4, Math.round(newNg * 0.80)),
            newNg
        ];
        DATA.iqc.weekRateCum = DATA.iqc.weekOkCum.map(function(ok, idx) {
            var ng = DATA.iqc.weekNgCum[idx];
            return +((ok / (ok + ng)) * 100).toFixed(1);
        });
        var sShares = [0.28, 0.22, 0.16, 0.14, 0.08, 0.06, 0.06, 0, 0, 0];
        DATA.iqc.suppliers.forEach(function(s, idx) {
            var ngVal = Math.round(newNg * sShares[idx]);
            s.ng = ngVal;
            s.total = Math.round(s.total * fIqc);
            s.ok = s.total - s.ng;
        });
        DATA.kpi.detPass = +(98.2 + (mIdx % 5) * 0.15).toFixed(2);
        DATA.kpi.plateRateWt = +(0.78 + (mIdx % 4) * 0.05).toFixed(2);
        DATA.complaints.brazing.count = Math.max(4, Math.round(8 * f));
        DATA.complaints.brazing.ppm = DATA.kpi.ppm;
        DATA.complaints.brazing.closed = Math.max(2, Math.round(DATA.complaints.brazing.count * 0.625));
        DATA.complaints.brazing.open = DATA.complaints.brazing.count - DATA.complaints.brazing.closed;
        DATA.complaints.brazing.closeRate = +(DATA.complaints.brazing.closed / DATA.complaints.brazing.count * 100).toFixed(1);
        renderKPIs(); renderWorkshop(); renderIqc(); renderComplaintModule(); renderOpenComplaints();
    }
