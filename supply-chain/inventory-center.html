<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存管理分析 - 宝得经营平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/alfa.css">
    <style>
        /* 台账表格鼠标滚轮滚动区域纤细滚动条 */
        .table-scroll-container::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-track {
            background: rgba(26, 35, 50, 0.04);
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(0, 87, 184, 0.35);
            border-radius: 4px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 87, 184, 0.65);

<body class="min-h-screen">
    <div class="flex min-h-screen">
        <aside id="sidebar" class="sidebar w-56 flex-shrink-0 relative flex flex-col min-h-screen"></aside>

        <main class="flex-1 overflow-auto">
            <!-- 顶部导航条 (与企业经营驾驶舱 100% 相同) -->
            <header id="page-header" class="top-bar sticky top-0 z-40 px-6 py-2.5">
                <div class="flex items-center justify-between">
                    <!-- 左侧：页面标题 -->
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-sm text-[#1A2332]">生产分析中心 · 库存管理</span>
                    </div>

                    <!-- 右侧：年月选择胶囊 (与驾驶舱 100% 保持一致：动态近三年与未来月份拦截) -->

                        <div class="relative inline-flex">
                            <div class="time-pill-group flex items-center px-3 py-1 select-none">
                                <!-- 年份选择触发器 -->
                                <div class="relative">
                                    <button id="yearDropdownBtn" onclick="toggleDropdown('yearDropdownMenu', event)" class="flex items-center gap-1 px-1.5 hover:text-[#0057B8] transition-colors cursor-pointer text-xs font-bold text-[#1A2332] mono-num">

                                        <svg class="w-3 h-3 text-[#0057B8] transition-transform duration-200" id="yearChevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"/>
                                        </svg>
                                    </button>

                                    <!-- 年份下拉菜单 (动态渲染近三年) -->
                                    <div id="yearDropdownMenu" class="hidden dropdown-menu-floating left-0 top-full mt-2 w-32 py-1.5">
                                        <div id="yearDropdownOptions"></div>
                                    </div>
                                </div>

                                <span class="text-[#0057B8] text-xs px-1 font-light opacity-60">|</span>

                                <!-- 月份选择触发器 -->
                                <div class="relative">
                                    <button id="monthDropdownBtn" onclick="toggleDropdown('monthDropdownMenu', event)" class="flex items-center gap-1 px-1.5 hover:text-[#0057B8] transition-colors cursor-pointer text-xs font-bold text-[#1A2332]">

                                        <svg class="w-3 h-3 text-[#0057B8] transition-transform duration-200" id="monthChevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"/>
                                        </svg>
                                    </button>

                                    <!-- 月份下拉菜单 (动态禁用未来月份) -->

                                        <div class="text-[10px] text-[#8A99B5] px-1 pb-1.5 font-semibold uppercase tracking-wider flex items-center justify-between">
                                            <span>选择月份</span>

                                        </div>

                                </div>

                        </div>
                    </div>
                </div>
            </header>

            <div class="p-3.5 space-y-3">

                            </div>

                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>

                            </div>

                        <div class="overflow-y-auto overflow-x-auto table-scroll-container rounded border border-[rgba(26,35,50,0.06)] bg-white/40" style="height: 208px; max-height: 208px;">
                            <table class="w-full text-xs text-left">
                                <thead class="sticky top-0 z-10 bg-[#EEF3F8] shadow-sm">
                                    <tr class="bg-[rgba(0,87,184,0.06)] text-[#6B7A94] text-[11px] font-bold border-b border-[rgba(26,35,50,0.1)]" style="height: 32px;">
                                        <th class="py-2 px-3">物料编码</th>
                                        <th class="py-2 px-3">品名规格</th>
                                        <th class="py-2 px-3">物料类别</th>
                                        <th class="py-2 px-3 text-right">在库数量</th>
                                        <th class="py-2 px-3 text-right">单位成本 (元)</th>
                                        <th class="py-2 px-3 text-right">库存金额 (万元)</th>
                                        <th class="py-2 px-3">入库日期</th>
                                        <th class="py-2 px-3 text-right">库龄天数</th>
                                        <th class="py-2 px-3">风险等级</th>
                                        <th class="py-2 px-3">责任人</th>
                                        <th class="py-2 px-3">拟处置方案</th>
                                    </tr>
                                </thead>
                                <tbody id="overdueMaterialTbody" class="divide-y divide-[rgba(26,35,50,0.05)]">
                                    <!-- 动态渲染 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    function renderKPIs() {
        var el = document.getElementById('kpi-cards');
        if (!el) return;
        el.innerHTML = KPIS.map(function (k) {
            var labelStyle = k.label.length > 7 ? 'style="font-size:10px;letter-spacing:-0.3px"' : '';
            return '<div class="kpi-cell sales-overview-cell cursor-default">' +
                '<div class="kpi-label" ' + labelStyle + '>' + k.label + '</div>' +
                '<div class="kpi-value sales-overview-value ' + k.valCls + '">' + k.value + '<span class="unit text-xs">' + k.unit + '</span></div>' +
                '</div>';
        }).join('');
    }

    function renderCompositionChart() {
        var dom = document.getElementById('invCompositionCenterChart');
        if (!dom) return;
        charts.composition = echarts.init(dom);
        
        var agingIntervals = [
            { name: '0-1月', value: 1152, pct: '61.0%', range: '≤30天', color: '#0057B8' },
            { name: '1-2月', value: 284, pct: '15.0%', range: '31-60天', color: '#2E6EB5' },
            { name: '2-6月', value: 266, pct: '14.1%', range: '61-180天', color: '#6B8EA8' },
            { name: '6-12月', value: 135, pct: '7.1%', range: '181-360天', color: '#E87722' },
            { name: '大于12月', value: 53, pct: '2.8%', range: '>360天', color: '#D64550' }
        ];

        charts.composition.setOption({
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(26, 35, 50, 0.92)',
                borderColor: 'rgba(255,255,255,0.2)',
                textStyle: { color: '#FFFFFF', fontSize: 12 },
                formatter: function(p) {
                    var item = agingIntervals.find(function(d) { return d.name === p.name; });
                    var rangeStr = item ? ' (' + item.range + ')' : '';
                    return '<div class="font-bold mb-1 text-xs">' + p.name + rangeStr + '</div>' +
                        '<div>成品金额：<b>' + p.value + ' 万元</b></div>' +
                        '<div>库龄占比：<b>' + p.percent + '%</b></div>';
                }
            },
            legend: {
                orient: 'vertical',
                right: 16,
                top: 'middle',
                textStyle: { color: '#4A5870', fontSize: 11 },
                formatter: function(name) {
                    var item = agingIntervals.find(function(d) { return d.name === name; });
                    if (item) {
                        return name + ' (' + item.range + ')  ' + item.value + '万 (' + item.pct + ')';
                    }
                    return name;
                }
            },
            series: [{
                name: '成品库龄区间',
                type: 'pie',
                radius: ['45%', '72%'],
                center: ['30%', '50%'],
                avoidLabelOverlap: true,
                itemStyle: { borderRadius: 4, borderColor: '#fff', borderWidth: 2 },
                label: { show: true, position: 'inside', formatter: '{d}%', fontSize: 10.5, color: '#fff', fontWeight: 'bold' },
                data: agingIntervals.map(function(d) {
                    return { value: d.value, name: d.name, itemStyle: { color: d.color } };
                })
            }]
        });
    }

    function renderMaterialTable() {
        var tbody = document.getElementById('overdueMaterialTbody');

                '<td class="py-1.5 px-3 text-right font-normal text-[#1A2332]">' + m.age + '天</td>' +
                '<td class="py-1.5 px-3 font-normal text-[#1A2332]">' + m.risk + '</td>' +
                '<td class="py-1.5 px-3 font-normal text-[#1A2332]">' + m.owner + '</td>' +

    function showToast(msg) {
        var el = document.getElementById('inventoryToast');
        if (!el) {
            el = document.createElement('div');
            el.id = 'inventoryToast';
            el.className = 'fixed bottom-6 right-6 z-50 bg-[#1A2332] text-white px-4 py-2.5 rounded-lg shadow-xl text-xs flex items-center gap-2 border border-slate-700/50 transition-all duration-300 opacity-0 pointer-events-none transform translate-y-2';
            document.body.appendChild(el);
        }
        el.innerHTML = '<svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span>' + msg + '</span>';
        el.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
        el.classList.add('opacity-100', 'translate-y-0');
        setTimeout(function() {
            el.classList.remove('opacity-100', 'translate-y-0');
            el.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
        }, 3000);
    }

    function exportMaterialLedgerExcel() {
        if (!MATERIAL_LIST || !MATERIAL_LIST.length) {
            alert('暂无物料数据可供导出');
            return;
        }

        var headers = ['物料编码', '品名规格', '物料类别', '在库数量', '单位成本 (元)', '库存金额 (万元)', '入库日期', '库龄天数', '风险等级', '责任人', '拟处置方案'];
        var aoa = [headers];

        MATERIAL_LIST.forEach(function(m) {
            aoa.push([
                m.no,
                m.name,
                m.cat,
                Number(m.qty),
                Number(m.cost),
                Number(m.amt),
                m.inDate,
                Number(m.age),
                m.risk,
                m.owner,
                m.plan
            ]);
        });

        var now = new Date();
        var y = now.getFullYear();
        var m = String(now.getMonth() + 1).padStart(2, '0');
        var d = String(now.getDate()).padStart(2, '0');
        var fileName = '高库龄与呆滞物料风险预警台账_' + y + m + d + '.xlsx';

        if (typeof XLSX !== 'undefined') {
            var ws = XLSX.utils.aoa_to_sheet(aoa);
            // 预设美观合理的列宽 (字符数)
            ws['!cols'] = [
                { wch: 15 }, // 物料编码
                { wch: 22 }, // 品名规格
                { wch: 12 }, // 物料类别
                { wch: 12 }, // 在库数量
                { wch: 14 }, // 单位成本(元)
                { wch: 15 }, // 库存金额(万元)
                { wch: 13 }, // 入库日期
                { wch: 10 }, // 库龄天数
                { wch: 12 }, // 风险等级
                { wch: 10 }, // 责任人
                { wch: 32 }  // 拟处置方案
            ];
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '高库龄呆滞台账');
            XLSX.writeFile(wb, fileName);
            showToast('已成功导出标准 Excel (.xlsx) 文件！');
        } else {
            alert('Excel 导出组件加载中，请稍后再试！');
        }
    }

    // 兼容原函数名
    function exportMaterialLedger() {
        exportMaterialLedgerExcel();
    }

        BDLayout.render({ active: 'prod-inv' });
        renderKPIs();
        renderCompositionChart();

        renderOverdueReasonChart();
        renderMaterialTable();

        window.addEventListener('resize', function() {
            for (var k in charts) {

    });
