<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购与供应商分析 - 宝得经营平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/alfa.css">
</head>
<body class="min-h-screen">
    <div class="flex min-h-screen">
        <aside id="sidebar" class="sidebar w-56 flex-shrink-0 relative flex flex-col min-h-screen"></aside>

        <main class="flex-1 overflow-auto">
            <!-- 顶部导航条 (与企业经营驾驶舱 100% 相同) -->
            <header id="page-header" class="top-bar sticky top-0 z-40 px-6 py-2.5">
                <div class="flex items-center justify-between">
                    <!-- 左侧：页面标题 -->
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-sm text-[#1A2332]">生产分析中心 · 采购与供应商</span>
                    </div>

                    <!-- 右侧：年月选择胶囊 (与驾驶舱 100% 保持一致：动态近三年与未来月份拦截) -->
                    <div class="flex items-center">
                        <div class="relative inline-flex">
                            <div class="time-pill-group flex items-center px-3 py-1 select-none">
                                <!-- 年份选择触发器 -->
                                <div class="relative">
                                    <button id="yearDropdownBtn" onclick="toggleDropdown('yearDropdownMenu', event)" class="flex items-center gap-1 px-1.5 hover:text-[#0057B8] transition-colors cursor-pointer text-xs font-bold text-[#1A2332] mono-num">
                                        <span id="currentYearText">2026</span>
                                        <svg class="w-3 h-3 text-[#0057B8] transition-transform duration-200" id="yearChevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"/>
                                        </svg>
                                    </button>

                                    <!-- 年份下拉菜单 (动态渲染近三年) -->
                                    <div id="yearDropdownMenu" class="hidden dropdown-menu-floating left-0 top-full mt-2 w-32 py-1.5">
                                        <div id="yearDropdownOptions"></div>
                                    </div>
                                </div>

                                <span class="text-[#0057B8] text-xs px-1 font-light opacity-60">|</span>

                                <!-- 月份选择触发器 -->
                                <div class="relative">
                                    <button id="monthDropdownBtn" onclick="toggleDropdown('monthDropdownMenu', event)" class="flex items-center gap-1 px-1.5 hover:text-[#0057B8] transition-colors cursor-pointer text-xs font-bold text-[#1A2332]">
                                        <span id="currentMonthText">9月</span>
                                        <svg class="w-3 h-3 text-[#0057B8] transition-transform duration-200" id="monthChevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"/>
                                        </svg>
                                    </button>

                                    <!-- 月份下拉菜单 (动态禁用未来月份) -->
                                    <div id="monthDropdownMenu" class="hidden dropdown-menu-floating right-0 top-full mt-2 w-48 p-2.5">
                                        <div class="text-[10px] text-[#8A99B5] px-1 pb-1.5 font-semibold uppercase tracking-wider flex items-center justify-between">
                                            <span>选择月份</span>
                                            <span class="text-[9px] text-[#6B7A94]" id="monthLimitTip">当期最多至9月</span>
                                        </div>
                                        <div class="grid grid-cols-3 gap-1.5" id="monthOptionsGrid"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="p-3.5 space-y-3">
                <!-- 模块 1：采购与供应链核心运营总览（与企业经营驾驶舱 100% 对齐） -->
                <div class="card">
                    <div class="card-inner">
                        <div class="flex items-center justify-between mb-2.5">
                            <h3 class="section-title">采购与供应商总览</h3>
                        </div>
                        <div id="kpi-cards" class="sales-overview-grid mb-1"></div>
                    </div>
                </div>

                <!-- 模块 2：准时到料率分析（月度趋势） -->
                <div class="card">
                    <div class="card-inner">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="section-title font-semibold text-[#1A2332]">准时到料率分析（月度趋势）</h3>
                        </div>
                        <div id="ontime-chart" class="chart-container" style="height: 300px; min-height: 300px;"></div>
                    </div>
                </div>

                <!-- 模块 3：采购与供应链排名分析 (供应商准时到料率 Top 10 · 降价物料 Top 10 · 涨价物料 Top 10) -->
                <div class="card">
                    <div class="card-inner">
                        <div class="flex items-center justify-between mb-2.5">
                            <div class="flex items-center gap-2.5">
                                <h3 class="section-title">采购与供应链排名分析</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full font-bold bg-[#8DC63F]/15 text-[#4E7F17] border border-[#8DC63F]/30 text-[11px]">
                                    降本达成 81.5%
                                </span>
                                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full font-bold bg-[#0057B8]/10 text-[#0057B8] border border-[#0057B8]/20 text-[11px]">
                                    降价物料 285万
                                </span>
                            </div>
                        </div>

                        <div class="multi-chart-row three">
                            <div class="chart-card">
                                <div class="chart-card-title">
                                    <span class="chart-card-title-text">供应商准时到料率 Top 10</span>
                                </div>
                                <div id="purchSupplierChart" class="chart-box" style="height:280px; min-height:280px;"></div>
                            </div>
                            <div class="chart-card">
                                <div class="chart-card-title">
                                    <span class="chart-card-title-text">降价物料 Top 10</span>
                                </div>
                                <div id="purchPriceDropChart" class="chart-box" style="height:280px; min-height:280px;"></div>
                            </div>
                            <div class="chart-card">
                                <div class="chart-card-title">
                                    <span class="chart-card-title-text">涨价物料 Top 10</span>
                                </div>
                                <div id="purchPriceRiseChart" class="chart-box" style="height:280px; min-height:280px;"></div>
                            </div>
                        </div>
                    </div>
                </div>



            </div>
        </main>
    </div>

    <script src="assets/js/layout.js"></script>
    <script>
    /* ============================================================
       模拟数据层（后端接入点：将 MOCK 替换为 fetch('/api/procurement?period=') 即可）
       ============================================================ */
    var MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

    function buildMock() {
        // 12个月趋势：计划送货~860单/月、准时到料、到货金额（万元，按入库日期统计）
        var raw = [
            { plan: 820, onTime: 782, amt: 5980 },
            { plan: 760, onTime: 721, amt: 5620 },
            { plan: 850, onTime: 812, amt: 6380 },
            { plan: 865, onTime: 828, amt: 6540 },
            { plan: 858, onTime: 824, amt: 6480 },
            { plan: 872, onTime: 838, amt: 6620 },
            { plan: 861, onTime: 827, amt: 6520 },
            { plan: 875, onTime: 843, amt: 6680 },
            { plan: 868, onTime: 832, amt: 6590 },
            { plan: 882, onTime: 849, amt: 6750 },
            { plan: 870, onTime: 835, amt: 6620 },
            { plan: 890, onTime: 857, amt: 6980 }
        ];
        var trend = MONTHS.map(function (m, i) {
            return { month: m, plan: raw[i].plan, onTime: raw[i].onTime, amt: raw[i].amt };
        });
        // 月度降本（万元）：全年目标合计600万，实际合计612万（降本比例102%）
        var saving = [
            { m: '1',  target: 40, actual: 42 }, { m: '2',  target: 45, actual: 48 },
            { m: '3',  target: 50, actual: 52 }, { m: '4',  target: 50, actual: 55 },
            { m: '5',  target: 55, actual: 58 }, { m: '6',  target: 60, actual: 63 },
            { m: '7',  target: 55, actual: 50 }, { m: '8',  target: 55, actual: 57 },
            { m: '9',  target: 50, actual: 51 }, { m: '10', target: 55, actual: 56 },
            { m: '11', target: 45, actual: 46 }, { m: '12', target: 40, actual: 34 }
        ];
        // 物料价格变动（钢卷、铜卷除外；正=降本 / 负=涨价）
        var materials = [
            { name: '316L不锈钢板',  prev: 18.60,  curr: 17.72,  qty: 386 },
            { name: '钛板 GR1',      prev: 168.00, curr: 159.60, qty: 46 },
            { name: '纯镍板 N4',     prev: 128.50, curr: 122.00, qty: 22 },
            { name: '铜镍合金板 B10', prev: 78.20,  curr: 74.50,  qty: 35 },
            { name: 'EPDM密封胶条',  prev: 26.80,  curr: 24.50,  qty: 64 },
            { name: '不锈钢封条304', prev: 15.20,  curr: 14.35,  qty: 128 },
            { name: '钼丝（焊接）',  prev: 452.00, curr: 468.50, qty: 8.5 },
            { name: '铝合金型材6063', prev: 21.40, curr: 22.60,  qty: 52 },
            { name: '哈氏合金C276板', prev: 385.00, curr: 372.00, qty: 12 },
            { name: '双相钢2205板',  prev: 32.50,  curr: 31.20,  qty: 95 }
        ];
        return {
            kpi: {
                planCount: 861, onTime: 827, rate: 96.1,           // 7月单月
                planYTD: 5886, onTimeYTD: 5632, amtYTD: 44140,     // 1-7月累计
                amt: 6520,                                        // 7月到货金额（万元）
                target: 355, actual: 368, ratio: 103.7             // 1-7月累计降本
            },
            trend: trend, saving: saving, materials: materials
        };
    }

    var DATA = buildMock();
    DATA.mIdx = 7; // 当前选中月份索引（1~12）
    var charts = {};

    /* ============================================================
       渲染逻辑
       ============================================================ */
    function fmt(n) { return n.toLocaleString('zh-CN'); }

    function renderKPIs() {
        var k = DATA.kpi;
        var cards = [
            { label: '到料达成率', id: 'PUR-003', formula: '准时送货单数 / 计划总单数', value: k.rate.toFixed(1), unit: '%', valCls: 'val-good', sub: 'PUR-003 · 达标' },
            { label: '计划送货数量', id: 'PUR-001', formula: '统计周期内计划采购订单总单数', value: fmt(k.planCount), unit: '单', valCls: 'val-blue', sub: 'PUR-001 · 年累 ' + fmt(k.planYTD) + ' 单' },
            { label: '准时到料数量', id: 'PUR-002', formula: '到货日期 <= 计划到货日期单数', value: fmt(k.onTime), unit: '单', valCls: 'val-good', sub: 'PUR-002 · 年累 ' + fmt(k.onTimeYTD) + ' 单' },
            { label: '采购到货金额', id: 'PUR-004', formula: 'SUM(到货入库金额)', value: fmt(k.amt), unit: '万', valCls: 'val-blue', sub: 'PUR-004 · 年累 ' + fmt(k.amtYTD) + ' 万' },
            { label: '采购降本目标', id: 'PUR-005', formula: 'SUM(各品号降本目标)', value: fmt(k.target), unit: '万', valCls: 'val-orange', sub: 'PUR-005 · 全年目标 600万' },
            { label: '实际降本金额', id: 'PUR-006', formula: '(上年均价 - 本年实价) × 采购量', value: fmt(k.actual), unit: '万', valCls: 'val-good', sub: 'PUR-006 · 环比增长' },
            { label: '降本达成比例', id: 'PUR-007', formula: '实际降本金额 / 降本目标金额', value: k.ratio.toFixed(1), unit: '%', valCls: 'val-good', sub: 'PUR-007 · 累计达标' },
            { label: '供应商履约达标率', id: 'MDM-002', formula: '准时交付合格供应商占比', value: '94.2', unit: '%', valCls: 'val-good', sub: 'MDM-002 · 核心供方 38家' }
        ];
        document.getElementById('kpi-cards').innerHTML = cards.map(function (c) {
            return '<div class="kpi-cell sales-overview-cell cursor-default" title="' + c.id + ' · ' + c.label + ' · ' + c.formula + '">' +
                '<div class="kpi-label">' + c.label + '</div>' +
                '<div class="kpi-value sales-overview-value ' + c.valCls + '">' + c.value + '<span class="unit text-xs">' + c.unit + '</span></div>' +
                '</div>';
        }).join('');
    }

    /* ---------- 准时到料率：柱线组合图 (动态截取至当前选定月份，未来月份不展示) ---------- */
    function renderOnTimeChart() {
        var el = document.getElementById('ontime-chart');
        if (!el) return;
        charts.ontime = charts.ontime || echarts.init(el);
        var mIdx = DATA.mIdx || 9;
        var displayMonths = MONTHS.slice(0, mIdx);
        var displayTrend = DATA.trend.slice(0, mIdx);

        var opt = alfaBaseChartOpt();
        opt.tooltip = {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            backgroundColor: '#0B1128',
            borderWidth: 0,
            padding: [8, 12],
            textStyle: { color: '#fff', fontSize: 12 },
            extraCssText: 'box-shadow: 0 4px 20px rgba(0,0,0,0.2);',
            formatter: function (ps) {
                var r = '<div class="font-bold pb-1 text-xs border-b border-white/20 mb-1">' + ps[0].axisValue + ' 到料达成分析</div>';
                ps.forEach(function (p) {
                    var unit = p.seriesName === '到料达成率' ? '%' : ' 单';
                    r += '<div class="flex items-center justify-between gap-4 text-xs py-0.5">' +
                            '<span><span style="color:' + p.color + '">● </span>' + p.seriesName + '</span>' +
                            '<span class="font-mono font-bold">' + p.value + unit + '</span>' +
                         '</div>';
                });
                return r;
            }
        };
        opt.xAxis = {
            type: 'category',
            data: displayMonths,
            axisLine: { lineStyle: { color: 'rgba(26,35,50,0.12)' } },
            axisTick: { show: false },
            axisLabel: { color: '#6B7A94', fontSize: 11 }
        };
        opt.yAxis = [
            {
                type: 'value',
                splitLine: { lineStyle: { color: 'rgba(26,35,50,0.08)', type: 'dashed' } },
                axisLabel: { color: '#8A99B5', fontSize: 11 }
            },
            {
                type: 'value',
                min: 90,
                max: 100,
                axisLabel: { formatter: '{value}%', color: '#8A99B5', fontSize: 11 },
                splitLine: { show: false }
            }
        ];
        var barW = mIdx <= 4 ? 32 : (mIdx <= 7 ? 24 : 18);
        opt.series = [
            {
                name: '计划送货数量',
                type: 'bar',
                barWidth: barW,
                itemStyle: { borderRadius: [3, 3, 0, 0], color: '#2E6EB5' },
                data: displayTrend.map(function (t) { return t.plan; })
            },
            {
                name: '准时到料数量',
                type: 'bar',
                barWidth: barW,
                itemStyle: { borderRadius: [3, 3, 0, 0], color: '#5ED4AD' },
                data: displayTrend.map(function (t) { return t.onTime; })
            },
            {
                name: '到料达成率',
                type: 'line',
                yAxisIndex: 1,
                smooth: true,
                symbolSize: 6,
                itemStyle: { color: '#E87722' },
                lineStyle: { color: '#E87722', width: 2.5 },
                data: displayTrend.map(function (t) { return +(t.onTime / t.plan * 100).toFixed(1); })
            }
        ];
        charts.ontime.setOption(opt, true);
    }

    /* ---------- 到货金额月度趋势 ---------- */
    function renderAmountChart() {
        var el = document.getElementById('amount-chart');
        if (!el) return;
        charts.amount = charts.amount || echarts.init(el);
        var opt = alfaBaseChartOpt();
        opt.legend.show = false;
        opt.xAxis = { type: 'category', data: MONTHS, axisLine: { lineStyle: { color: '#E5E5E5' } }, axisTick: { show: false }, axisLabel: { color: '#656565', fontSize: 10, interval: 1 } };
        opt.yAxis = { type: 'value', splitLine: { lineStyle: { color: '#EEEEEC' } }, axisLabel: { color: '#ACACAC', fontSize: 10 } };
        opt.series = [{
            name: '到货金额', type: 'bar', barWidth: 16,
            itemStyle: { borderRadius: [3, 3, 0, 0], color: '#11387F' },
            data: DATA.trend.map(function (t) { return t.amt; })
        }];
        charts.amount.setOption(opt, true);
    }

    function renderAmountKpis() {
        var el = document.getElementById('amount-kpis');
        if (!el) return;
        var k = DATA.kpi;
        el.innerHTML = [
            { l: '年累计到货', v: fmt(k.amtYTD) + '万', c: '#0B1128' },
            { l: '月均到货', v: fmt(Math.round(k.amtYTD / DATA.mIdx)) + '万', c: '#0068FF' },
            { l: '单均到货', v: (k.amt / k.planCount).toFixed(1) + '万', c: '#2FA984' }
        ].map(function (x) {
            return '<div class="kpi-box"><div class="text-xs text-[#656565] mb-1">' + x.l + '</div><div class="text-lg font-bold" style="color:' + x.c + '">' + x.v + '</div></div>';
        }).join('');
    }

    /* ---------- 降本目标 vs 实际降本（月度累计对比柱图） ---------- */
    function renderSavingChart() {
        var el = document.getElementById('saving-chart');
        if (!el) return;
        charts.saving = charts.saving || echarts.init(el);
        var cumTarget = [], cumActual = [], ct = 0, ca = 0;
        DATA.saving.forEach(function (s) {
            ct += s.target; ca += s.actual;
            cumTarget.push(ct); cumActual.push(ca);
        });
        var opt = alfaBaseChartOpt();
        opt.tooltip.formatter = function (ps) {
            var html = ps[0].name + '<br/>';
            ps.forEach(function (p) { html += p.marker + p.seriesName + '：' + fmt(p.value) + ' 万<br/>'; });
            var i = ps[0].dataIndex;
            html += '降本比例：' + (cumActual[i] / cumTarget[i] * 100).toFixed(1) + '%';
            return html;
        };
        opt.xAxis = { type: 'category', data: MONTHS, axisLine: { lineStyle: { color: '#E5E5E5' } }, axisTick: { show: false }, axisLabel: { color: '#656565' } };
        opt.yAxis = { type: 'value', name: '累计金额(万)', nameTextStyle: { color: '#ACACAC' }, splitLine: { lineStyle: { color: '#EEEEEC' } }, axisLabel: { color: '#ACACAC' } };
        opt.series = [
            { name: '降本目标(累计)', type: 'bar', barWidth: 14, itemStyle: { borderRadius: [3, 3, 0, 0] }, data: cumTarget },
            { name: '实际降本(累计)', type: 'bar', barWidth: 14, itemStyle: { borderRadius: [3, 3, 0, 0], color: '#2FA984' }, data: cumActual }
        ];
        charts.saving.setOption(opt, true);
    }

    /* ---------- 降本比例进度条可视化 ---------- */
    function ratioColor(r) { return r >= 100 ? '#2FA984' : (r >= 90 ? '#0068FF' : '#E87722'); }

    function renderProgress() {
        var progEl = document.getElementById('ratio-progress');
        if (!progEl) return;
        var mIdx = DATA.mIdx, i;
        var cumT = 0, cumA = 0;
        for (i = 0; i < mIdx; i++) { cumT += DATA.saving[i].target; cumA += DATA.saving[i].actual; }
        var yearRatio = cumA / cumT * 100;
        // 年度（1~选中月）累计大进度条
        var html = '<div class="p-4 rounded bg-[#F8F8F8] mb-5">' +
            '<div class="flex items-center justify-between mb-2">' +
            '<span class="text-xs font-medium text-[#0B1128]">1~' + mIdx + '月累计达成</span>' +
            '<span class="text-base font-bold" style="color:' + ratioColor(yearRatio) + '">' + yearRatio.toFixed(1) + '%</span></div>' +
            '<div class="progress-bar-bg" style="height:10px"><div class="progress-bar-fill" style="width:' + Math.min(yearRatio / 120 * 100, 100).toFixed(1) + '%;background:' + ratioColor(yearRatio) + '"></div></div>' +
            '<div class="flex items-center justify-between mt-2 text-xs text-[#ACACAC]"><span>实际 ' + fmt(cumA) + ' 万</span><span>目标 ' + fmt(cumT) + ' 万</span></div></div>';
        // 月度进度条（宽度按 120% 满刻度映射）
        html += '<div class="space-y-3">';
        for (i = 0; i < mIdx; i++) {
            var s = DATA.saving[i];
            var r = s.actual / s.target * 100;
            html += '<div class="flex items-center gap-3">' +
                '<span class="text-xs text-[#656565] w-7 flex-shrink-0">' + s.m + '月</span>' +
                '<div class="progress-bar-bg flex-1"><div class="progress-bar-fill" style="width:' + Math.min(r / 120 * 100, 100).toFixed(1) + '%;background:' + ratioColor(r) + '"></div></div>' +
                '<span class="text-xs font-semibold w-12 text-right flex-shrink-0" style="color:' + ratioColor(r) + '">' + r.toFixed(1) + '%</span></div>';
        }
        html += '</div>';
        progEl.innerHTML = html;
    }

    /* ---------- 物料价格变动分析表格 ---------- */
    function renderMaterials() {
        var tbody = document.getElementById('material-tbody');
        if (!tbody) return;
        var rows = '', total = 0;
        DATA.materials.forEach(function (mt) {
            var diff = (mt.curr - mt.prev) / mt.prev * 100;                       // 价差率：正=涨 / 负=降
            var saving = (mt.prev - mt.curr) * mt.qty * 1000 / 10000;             // 降本金额（万元）：正=降本 / 负=涨价
            total += saving;
            var up = saving < 0;
            var color = up ? '#E87722' : '#2FA984';
            rows += '<tr>' +
                '<td class="text-[#0B1128] font-medium">' + mt.name + ' <span class="status-tag ' + (up ? 'status-warning' : 'status-success') + ' ml-1">' + (up ? '涨' : '降') + '</span></td>' +
                '<td class="text-right text-[#656565]">' + mt.prev.toFixed(2) + '</td>' +
                '<td class="text-right text-[#656565]">' + mt.curr.toFixed(2) + '</td>' +
                '<td class="text-right font-semibold" style="color:' + color + '">' + (diff >= 0 ? '+' : '') + diff.toFixed(1) + '%</td>' +
                '<td class="text-right text-[#656565]">' + mt.qty + '</td>' +
                '<td class="text-right font-bold" style="color:' + color + '">' + (saving >= 0 ? '+' : '') + saving.toFixed(1) + '</td></tr>';
        });
        var tc = total < 0 ? '#E87722' : '#2FA984';
        rows += '<tr><td class="font-semibold text-[#0B1128]">合计</td>' +
            '<td colspan="4" class="text-xs text-[#ACACAC]"></td>' +
            '<td class="text-right font-bold" style="color:' + tc + '">' + (total >= 0 ? '+' : '') + total.toFixed(1) + '</td></tr>';
        tbody.innerHTML = rows;
    }

    /* ---------- 月份联动 ---------- */
    function onPeriodChange() {
        var p = BDLayout.getPeriod();
        var mIdx = parseInt(p.month) || 9;
        DATA.mIdx = mIdx;
        var t = DATA.trend[mIdx - 1];
        var k = DATA.kpi;
        // 单月指标
        k.planCount = t.plan;
        k.onTime = t.onTime;
        k.rate = +(t.onTime / t.plan * 100).toFixed(1);
        k.amt = t.amt;
        // 累计指标（后端接入后替换为真实接口数据）
        var pc = 0, oc = 0, am = 0, tt = 0, ta = 0, i;
        for (i = 0; i < mIdx; i++) {
            pc += DATA.trend[i].plan; oc += DATA.trend[i].onTime; am += DATA.trend[i].amt;
            tt += DATA.saving[i].target; ta += DATA.saving[i].actual;
        }
        k.planYTD = pc; k.onTimeYTD = oc; k.amtYTD = am;
        k.target = tt; k.actual = ta; k.ratio = +(ta / tt * 100).toFixed(1);
        renderKPIs();
        renderOnTimeChart();
        renderPurchTop10Charts();
    }
    window.onPeriodChange = onPeriodChange;

    /* ---------- 初始化 ---------- */
    BDLayout.render({ active: 'prod-purch', title: '采购与供应商' });
    renderKPIs(); renderPurchTop10Charts(); renderOnTimeChart();
    // 触发根据当前全局年月统一对齐
    onPeriodChange();
    window.addEventListener('resize', function () { Object.values(charts).forEach(function (c) { if (c && typeof c.resize === 'function') c.resize(); }); });
