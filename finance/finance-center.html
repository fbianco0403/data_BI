<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务分析中心 - 宝得经营平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/alfa.css">
    <style>
        th {
            font-family: 'Roboto', 'AlfaLaval', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
            font-weight: 700;
        }
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scroll::-webkit-scrollbar-track { background: #f8fafc; }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex min-h-screen">

        <!-- ============== 左侧导航栏 ============== -->
        <aside id="sidebar" class="sidebar w-56 flex-shrink-0 relative flex flex-col min-h-screen"></aside>

        <!-- ============== 主内容区 ============== -->
        <main class="flex-1 overflow-auto">
            <!-- 顶栏 (与任务分析中心及驾驶舱100%保持完全一致) -->
            <header id="page-header" class="top-bar sticky top-0 z-40 px-6 py-2.5">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <span class="font-bold text-sm text-[#1A2332]">财务分析中心</span>
                    </div>


                </div>
            </header>

            <div class="p-3.5 space-y-3">

                <!-- 财务指标分析看板卡片 (样式与任务分析中心完全保持一致) -->
                <div class="card">
                    <div class="card-inner">
                        <!-- 头部控制栏：单竖线章节标题 + 右侧标准筛选控件组 -->
                        <div class="flex items-center justify-between mb-3 pb-2.5 border-b border-[rgba(26,35,50,0.06)] flex-wrap gap-2">
                            <div class="flex items-center gap-2">
                                <h3 class="section-title">财务经营指标清单</h3>
                            </div>

                            <!-- 右侧筛选与操作控件组 (样式100%对齐任务中心) -->
                            <div class="flex items-center gap-2 flex-wrap text-xs">
                                <!-- 月份选择下拉框 -->
                                <select id="monthFilterSelect" onchange="onMonthSelectChanged(this.value)" class="border border-slate-200 rounded-lg px-2.5 py-1 bg-white text-xs text-[#1A2332] outline-none cursor-pointer">
                                    <option value="9">2026年9月 (当期)</option>
                                    <option value="8">2026年8月</option>
                                    <option value="7">2026年7月</option>
                                    <option value="6">2026年6月</option>
                                    <option value="5">2026年5月</option>
                                    <option value="4">2026年4月</option>
                                    <option value="3">2026年3月</option>
                                    <option value="2">2026年2月</option>
                                    <option value="1">2026年1月</option>
                                    <option value="all">全部月份 (1~9月)</option>
                                </select>

                                <!-- 关键词搜索 -->
                                <div class="relative">
                                    <input type="text" id="financeSearchInput" oninput="applyTableSearch()" placeholder="搜索指标名称/备注..." class="pl-7 pr-2.5 py-1 text-xs border border-slate-200 rounded-lg focus:outline-none focus:border-[#0057B8] w-48 bg-slate-50/50">
                                    <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2 top-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                </div>

                                <!-- 重置按钮 -->
                                <button type="button" onclick="resetFinanceFilters()" class="px-2.5 py-1 rounded-lg border border-slate-200 text-[#6B7A94] hover:text-[#1A2332] hover:bg-slate-50 transition cursor-pointer">重置</button>

                                <!-- 导出按钮 -->
                                <button type="button" onclick="exportFinanceCenterExcel()" class="px-2.5 py-1 rounded-lg border border-[rgba(0,87,184,0.3)] bg-[#0057B8]/10 hover:bg-[#0057B8]/15 text-xs font-bold text-[#0057B8] transition-all flex items-center gap-1 cursor-pointer" title="导出当前视图的财务指标数据至Excel文件">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                    <span>导出数据</span>
                                </button>
                            </div>
                        </div>

                        <!-- 财务指标表格 (严格对齐: 序号、经营指标、计划、实际、差异率、差异金额、差异分析/备注) -->
                        <div class="overflow-x-auto max-h-[560px] custom-scroll border border-slate-200 rounded-lg">
                            <table class="text-xs text-left border-collapse w-full" style="min-width: 980px;">
                                <thead class="sticky top-0 z-30 bg-[#F4F7FA]">
                                    <tr class="bg-[#F4F7FA] text-[#6B7A94] text-[11px] font-bold border-b border-slate-200 whitespace-nowrap" style="height: 36px;">
                                        <th class="px-3 text-center border-r border-slate-200/60" style="width: 55px;">序号</th>
                                        <th class="px-4 border-r border-slate-200/60" style="width: 250px;">经营指标</th>
                                        <th class="px-3 text-right border-r border-slate-200/60" style="width: 120px;">计划</th>
                                        <th class="px-3 text-right border-r border-slate-200/60" style="width: 120px;">实际</th>
                                        <th class="px-3 text-right border-r border-slate-200/60" style="width: 110px;">差异率</th>
                                        <th class="px-3 text-right border-r border-slate-200/60" style="width: 120px;">差异金额</th>
                                        <th class="px-4 text-left">差异分析/备注</th>
                                    </tr>
                                </thead>
                                <tbody id="financeTableBody" class="divide-y divide-[rgba(26,35,50,0.06)] text-[#1A2332] text-xs"></tbody>
                            </table>
                        </div>

                        <!-- 分页条 (与任务中心 < 1 / 1 > 紧凑风格完全对齐) -->
                        <div id="financePaginationBar" class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-[#6B7A94]"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- 简易 Toast -->
    <div id="toastNotification" class="fixed bottom-6 right-6 z-50 bg-[#1A2332] text-white text-xs px-4 py-2.5 rounded-xl shadow-2xl transform translate-y-10 opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
        <span id="toastIcon">🟢</span>
        <span id="toastMsg">操作成功</span>
    </div>

    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/finance-target-store.js"></script>
    <script>
    var currentMonth = 9; // 默认展示当期9月
    var searchKeyword = '';
    var page = 1;
    var pageSize = 20;

    window.addEventListener('DOMContentLoaded', function () {
        BDLayout.render({ active: 'finance' });
        // 初始化月份下拉框值
        var selectEl = document.getElementById('monthFilterSelect');
        if (selectEl) selectEl.value = String(currentMonth);
        renderTable();
    });

    // 顶栏月份变动联动
    window.onPeriodChange = function () {
        var p = BDLayout.getPeriod();
        var m = parseInt(p.month) || 9;
        currentMonth = m;
        var selectEl = document.getElementById('monthFilterSelect');
        if (selectEl) selectEl.value = String(m);
        page = 1;
        renderTable();
    };

    // 月份选择框改变事件
    function onMonthSelectChanged(val) {
        if (val === 'all') {
            currentMonth = 'all';
        } else {
            currentMonth = parseInt(val) || 9;
        }
        page = 1;
        renderTable();
    }

    // 关键词搜索
    function applyTableSearch() {
        searchKeyword = document.getElementById('financeSearchInput').value.trim();
        page = 1;
        renderTable();
    }

    // 重置所有筛选条件
    function resetFinanceFilters() {
        currentMonth = 9;
        searchKeyword = '';
        var selectEl = document.getElementById('monthFilterSelect');
        if (selectEl) selectEl.value = '9';
        var searchEl = document.getElementById('financeSearchInput');
        if (searchEl) searchEl.value = '';
        page = 1;
        renderTable();
        showToast('已重置筛选条件');
    }

    // 数值通用格式化
    function formatNum(val) {
        if (val === undefined || val === null || isNaN(val) || String(val).trim() === '') return '';
        return Number(val).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    // 核心表格渲染：严格遵循无花哨颜色、无+-符号、空白展示空白规范
    function renderTable() {
        var allRows = [];
        if (currentMonth === 'all') {
            allRows = BaodeFinanceStore.getAllRows();
        } else {
            allRows = BaodeFinanceStore.getRowsByMonth(currentMonth);
        }

        // 关键词过滤
        var filtered = allRows.filter(function(r) {
            if (!searchKeyword) return true;
            return r.indicator.indexOf(searchKeyword) !== -1 || (r.remark && r.remark.indexOf(searchKeyword) !== -1);
        });

        var tbody = document.getElementById('financeTableBody');
        var total = filtered.length;
        var maxPages = Math.ceil(total / pageSize) || 1;
        if (page > maxPages) page = maxPages;

        var start = (page - 1) * pageSize;
        var end = Math.min(start + pageSize, total);
        var pageRows = filtered.slice(start, end);

        if (pageRows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center py-10 text-slate-400 text-xs">未找到符合条件的财务指标记录</td></tr>';
            renderPaginationBar(0, 1, 1);
            return;
        }

        var html = pageRows.map(function(r, idx) {
            var seq = start + idx + 1;

            // 差异金额：若为空或0或无数据展示空白，不带+-号，不带颜色
            var hasDiffAmt = (r.diffAmount !== null && r.diffAmount !== undefined && String(r.diffAmount).trim() !== '' && !isNaN(Number(r.diffAmount)));
            var diffAmtText = '';
            if (hasDiffAmt) {
                var amtNum = Math.abs(Number(r.diffAmount));
                diffAmtText = amtNum === 0 ? '' : formatNum(amtNum);
            }

            // 差异率：若为空或0或无数据展示空白，不带+-号，不带颜色
            var hasDiffRate = (r.diffRate !== null && r.diffRate !== undefined && String(r.diffRate).trim() !== '' && String(r.diffRate).trim() !== '-');
            var diffRateText = '';
            if (hasDiffRate) {
                var rawRateStr = String(r.diffRate).trim();
                var rateNum = parseFloat(rawRateStr.replace('%', ''));
                if (!isNaN(rateNum)) {
                    var absRate = Math.abs(rateNum);
                    diffRateText = absRate === 0 ? '' : absRate.toFixed(2) + '%';
                } else {
                    diffRateText = rawRateStr.replace(/^[+-]/, '');
                }
            }

            // 经营指标列展示：如果在“全部月份”模式下，附带月份标识
            var indicatorDisplay = r.indicator;
            if (currentMonth === 'all' && r.month) {
                indicatorDisplay = '<span class="text-slate-400 font-normal mr-1.5">[' + r.month + ']</span>' + r.indicator;
            }

            return '<tr class="hover:bg-slate-50/80 transition-colors">' +
                '<td class="px-3 py-2.5 text-center text-slate-400 font-mono text-xs">' + seq + '</td>' +
                '<td class="px-4 py-2.5 text-[#1A2332] font-medium text-xs whitespace-nowrap">' + indicatorDisplay + '</td>' +
                '<td class="px-3 py-2.5 text-right font-mono text-[#1A2332] text-xs">' + formatNum(r.plan) + '</td>' +
                '<td class="px-3 py-2.5 text-right font-mono text-[#1A2332] text-xs">' + formatNum(r.actual) + '</td>' +
                '<td class="px-3 py-2.5 text-right font-mono text-[#1A2332] text-xs">' + diffRateText + '</td>' +
                '<td class="px-3 py-2.5 text-right font-mono text-[#1A2332] text-xs">' + diffAmtText + '</td>' +
                '<td class="px-4 py-2.5 text-slate-600 text-xs">' + (r.remark || '-') + '</td>' +
            '</tr>';
        }).join('');

        tbody.innerHTML = html;
        renderPaginationBar(total, page, maxPages);
    }

    // 分页条渲染：与任务分析中心 < 1 / 1 > 风格完全对齐
    function renderPaginationBar(total, curPage, totalPages) {
        var el = document.getElementById('financePaginationBar');
        if (!el) return;

        var prevDisabled = curPage <= 1
            ? 'disabled class="opacity-30 cursor-not-allowed px-2 py-0.5 border border-slate-200 rounded text-xs"'
            : 'class="px-2 py-0.5 border border-slate-200 rounded hover:bg-slate-50 transition cursor-pointer text-[#1A2332] text-xs font-bold" onclick="setFinancePage(' + (curPage - 1) + ')"';

        var nextDisabled = curPage >= totalPages
            ? 'disabled class="opacity-30 cursor-not-allowed px-2 py-0.5 border border-slate-200 rounded text-xs"'
            : 'class="px-2 py-0.5 border border-slate-200 rounded hover:bg-slate-50 transition cursor-pointer text-[#1A2332] text-xs font-bold" onclick="setFinancePage(' + (curPage + 1) + ')"';

        el.innerHTML = '<div class="flex items-center gap-2">' +
            '<span>财务经营指标清单</span>' +
            '<span class="text-slate-300">|</span>' +
            '<span>共 <b class="text-[#1A2332] font-mono">' + total + '</b> 条记录</span>' +
        '</div>' +
        '<div class="flex items-center gap-2">' +
            '<button ' + prevDisabled + '>&lt;</button>' +
            '<span class="text-xs font-mono text-[#1A2332] font-medium">' + curPage + ' / ' + totalPages + '</span>' +
            '<button ' + nextDisabled + '>&gt;</button>' +
        '</div>';
    }

    function setFinancePage(p) {
        page = p;
        renderTable();
    }

    // 导出当前月份数据为 Excel
    function exportFinanceCenterExcel() {
        try {
            var rows = (currentMonth === 'all') ? BaodeFinanceStore.getAllRows() : BaodeFinanceStore.getRowsByMonth(currentMonth);
            var header = ["序号", "经营指标", "计划", "实际", "差异率", "差异金额", "差异分析/备注"];
            var aoa = [header];

            rows.forEach(function(r, idx) {
                var indName = (currentMonth === 'all' && r.month) ? ('[' + r.month + '] ' + r.indicator) : r.indicator;
                aoa.push([
                    idx + 1,
                    indName,
                    r.plan,
                    r.actual,
                    r.diffRate || '',
                    r.diffAmount || '',
                    r.remark || ''
                ]);
            });

            var ws = XLSX.utils.aoa_to_sheet(aoa);
            ws['!cols'] = [
                { wch: 6 }, { wch: 24 }, { wch: 14 }, { wch: 14 }, { wch: 12 }, { wch: 14 }, { wch: 40 }
            ];

            var wb = XLSX.utils.book_new();
            var titleStr = currentMonth === 'all' ? '1~9月全量' : (currentMonth + '月');
            XLSX.utils.book_append_sheet(wb, ws, "财务经营指标");
            XLSX.writeFile(wb, "宝得经营平台_财务指标分析报表_2026年" + titleStr + ".xlsx");
            showToast("已成功导出财务指标报表 (Excel)！");
        } catch (e) {
            alert("导出失败：" + e.message);
        }
    }

    function showToast(msg) {
        var t = document.getElementById('toastNotification');
        document.getElementById('toastMsg').innerText = msg;
        t.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');
        setTimeout(function () {
            t.classList.add('translate-y-10', 'opacity-0', 'pointer-events-none');
        }, 2200);
    }
    </script>
</body>
</html>
